<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Plate / Recycled Loop Icon -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="36" fill="url(#grad1)" filter="url(#shadow)" />
    <!-- Plate Inner Circle -->
    <circle cx="40" cy="40" r="26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 2" />
    <!-- Circular Arrow / RePlate Loop -->
    <path d="M 28 32 A 14 14 0 1 1 52 48" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <polyline points="46 48 53 48 53 41" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Brand -->
  <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#0F172A" letter-spacing="-0.5">
    Re<tspan fill="#10B981">Plate</tspan>
  </text>
  
  <text x="98" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748B" letter-spacing="0.5">
    Predict better. Prepare smarter. Waste less.
  </text>
</svg>
